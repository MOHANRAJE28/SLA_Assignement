    <script>
// 1. Write a Program to reverse a string in JavaScript
        let str="mohan";
        let n=str.length;
        let rstr ="";

        console.log(n);
        for(let i=n-1;i>=0;i--){
            // console.log(str[i]);
            rstr+=str[i];
        }
        console.log(rstr);


        // 2. Write a Program to check whether a string is a palindrome string.

        let str1 = "SASA";
        let sr = true;
        let i=0;
        let j=str1.length-1;

        while(i<j){
            
            if(str1[i] !== str1[j]){
                sr=false;
                break;
            }

            i++;
            j--;
        }
        if(sr){
            console.log("palindrome");

        }else{
            console.log("not palindrome");
        }

        let arr = [34,45,56,5,23] ;
        let max= arr[0];
        for(let i=1;i<n;i++){

            if(max < arr[i]){
                max = arr[i];
            }

        }
        console.log(max);
